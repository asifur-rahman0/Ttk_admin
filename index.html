<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nerivo Admin</title>
<style>
:root{--g:#0b7a55;--gd:#0a3d2e;--mint:#e6f4ec;--line:#d9e2de;--mute:#7d8b86;--ink:#10231d;--red:#c0392b}
*{box-sizing:border-box;margin:0}
body{font-family:"Segoe UI",Roboto,system-ui,sans-serif;background:#f3f6f4;color:var(--ink)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 16px;background:var(--g);color:#fff}
button.out{background:#fff;color:var(--g);border:1px solid var(--g)}button.red{background:var(--red)}button.sm{padding:6px 12px;font-size:13px}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
label{display:block;font-size:13px;color:var(--mute);margin-top:12px}
.wrap{display:flex;min-height:100vh}
aside{width:210px;background:var(--gd);color:#fff;padding:22px 12px;flex:none}
aside h2{padding:0 10px 18px;font-size:20px}
aside button{display:block;width:100%;text-align:left;background:none;border-radius:10px;padding:12px;margin-bottom:4px;color:#cfe6dc}
aside button.act{background:#ffffff22;color:#fff;font-weight:700}
main{flex:1;padding:24px;min-width:0}
h1{font-size:24px;margin-bottom:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.card small{color:var(--mute)}.card b{display:block;font-size:26px;margin-top:6px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mute);font-weight:600}
.tag{padding:3px 10px;border-radius:12px;font-size:12px;background:var(--mint);color:var(--gd)}.tag.x{background:#fde8e6;color:var(--red)}.tag.cr{background:#fff3d6;color:#8a5a00}.tag.lk{background:#ece6f7;color:#5a3d99}.tag.fz{background:#dcefff;color:#0b5394}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
.login{max-width:360px;margin:12vh auto;background:#fff;padding:28px;border-radius:20px;border:1px solid var(--line)}
.err{color:var(--red);font-size:14px;margin-top:10px;min-height:18px}
.modal{position:fixed;inset:0;background:#0006;display:grid;place-items:center;padding:16px;z-index:5}
.sheet{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gd);color:#fff;padding:12px 20px;border-radius:24px;z-index:9}
@media(max-width:700px){.wrap{flex-direction:column}aside{width:100%;display:flex;flex-wrap:wrap;gap:4px;padding:12px}aside h2{width:100%;padding:0 6px 6px}aside button{width:auto;margin:0}main{padding:16px}}
:focus-visible{outline:3px solid #00a99d;outline-offset:2px}
</style>
</head>
<body>
<div id="root"><p style="padding:40px 20px;color:#7d8b86">Loading...</p></div>

<script>
function showErr(m){var d=document.getElementById('errbar')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'errbar'}));d.style.cssText='position:fixed;left:0;right:0;bottom:0;background:#c0392b;color:#fff;padding:12px 16px;font-size:13px;z-index:99;word-break:break-word';d.textContent='Error: '+m;}
addEventListener('error',function(e){showErr(e.message)});
addEventListener('unhandledrejection',function(e){showErr((e.reason&&e.reason.message)||e.reason)});
setTimeout(function(){var a=document.getElementById('app')||document.getElementById('root');if(a&&a.textContent.trim()==='Loading...')showErr('Still loading after 8 seconds. Check internet connection and that Firestore Database is created.')},8000);
</script>
<script type="module">
/* ====== Paste the SAME Firebase config you used in index.html ====== */
const firebaseConfig = {
  apiKey: "AIzaSyCWX-SgIhFjVAsi4REfJ7ZAlikg3x2DZZw",
  authDomain: "chatting-e498d.firebaseapp.com",
  projectId: "chatting-e498d",
  storageBucket: "chatting-e498d.firebasestorage.app",
  messagingSenderId: "765847410526",
  appId: "1:765847410526:web:420422de2045d4255c21cf",
  measurementId: "G-9FKGHT0TXT"
};
/* =================================================================== */

const DEMO = firebaseConfig.apiKey === "YOUR_API_KEY";
let fb = {}, auth, db;
if (!DEMO) try {
  const V = "https://www.gstatic.com/firebasejs/10.12.2/";
  const [a, f, ap] = await Promise.all([import(V+"firebase-auth.js"), import(V+"firebase-firestore.js"), import(V+"firebase-app.js")]);
  fb = { ...a, ...f };
  const app = ap.initializeApp(firebaseConfig);
  auth = a.initializeAuth(app, { persistence: [a.indexedDBLocalPersistence, a.browserLocalPersistence, a.inMemoryPersistence] }); db = f.initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
} catch(e) { showErr("Firebase could not load: "+e.message+" (check internet or VPN)"); throw e; }

const $ = s => document.querySelector(s);
const fmt = n => Number(n || 0).toFixed(2);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S = { admin:false, tab:"dash", users:[], orders:[], rates:{usdt:130.34,bonus:3}, err:"", of:"all", oq:"", wl:{bkash:[],nagad:[]} };
let unsubs = [];
/* Order status: open -> created (user claimed + picked wallet) -> success / failed / lock (admin decides). Old names are mapped. */
const NS = s => ({reserved:"created",pending:"created",done:"success",claimed:"success",rejected:"failed"})[s] || s;
const LBL = {open:"Open",created:"Order Create",success:"Success",failed:"Failed",lock:"Lock"};
const TC = {created:"cr",lock:"lk",failed:"x"};
const tms = t => t?.toMillis?.() || (typeof t==="number" ? t : 0);
/* Saved wallet numbers (shown to the user when they claim an order) */
const WL_KEY = "nerivo_wallets";
function loadW(){ try { const j = JSON.parse(localStorage.getItem(WL_KEY)||"null"); if (j) S.wl = { bkash:j.bkash||[], nagad:j.nagad||[] }; } catch {} }
async function saveW(){
  try { localStorage.setItem(WL_KEY, JSON.stringify(S.wl)); } catch {}
  if (!DEMO) { try { await fb.setDoc(fb.doc(db,"settings","wallets"), S.wl); } catch(e) { toast("Saved on this device only ("+(e.code||"error")+")"); } }
}
loadW();
window.pickNum = (id,v) => { if (v) { const el = $("#"+id); if (el) el.value = v; } };
const fdt = ms => ms ? new Date(ms).toLocaleString() : "-";
/* Account status + balance reasons */
const ACC = { active:"Active", banned:"Banned", suspended:"Suspended", frozen:"Frozen", locked:"Locked" };
const ACC_TC = { banned:"x", suspended:"cr", frozen:"fz", locked:"lk" };
const uName = u => u.phone || (u.email||"").replace(/@nerivo\.local$/,"");
const uStatus = u => u.accountStatus || (u.disabled ? "banned" : "active");
const DEFAULT_REASONS = [ { id:"system_credit", label:"System Credit", type:"credit" }, { id:"withdraw", label:"Withdraw", type:"debit" }, { id:"system_debit", label:"System Debit", type:"debit" } ];
S.reasons = DEFAULT_REASONS.map(r => ({...r}));
const RT = { credit:"Add balance", debit:"Cut balance", both:"Add & Cut" };
const modal = html => { const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<div class="sheet">${html}</div>`; document.body.append(m); return m; };
const adminEmail = () => (auth?.currentUser?.email) || "admin";
const toast = m => { const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.append(t); setTimeout(()=>t.remove(),2200); };

if (DEMO) {
  S.users = [{id:"u1",phone:"+8801840000059",email:"demo@nerivo.app",balance:13.63,income:1245.46,saleAmount:45222,saleOrders:39,purchaseAmount:0,purchaseOrders:0,code:"WcLvJ8"}];
  S.orders = [{id:"a",amount:111,type:"bkash",mask:"179***7kPO",rate:3,cancels:0,status:"open"},{id:"b",amount:110,type:"nagad",mask:"179***q0HO",rate:3,cancels:0,status:"claimed"}];
}

/* ---------- Views ---------- */
function login(){
  return `<div class="login"><h1 style="margin-bottom:4px">Nerivo Admin</h1><p style="color:var(--mute);font-size:14px">${DEMO?"Demo mode: Firebase not set up. Tap Log in to preview.":"Only accounts listed in the admins collection can enter."}</p>
  <label>Email</label><input id="em" type="email" autocomplete="email"><label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <div class="err">${esc(S.err)}</div><button style="width:100%;margin-top:8px" data-login>Log in</button></div>`;
}

function dash(){
  const sum = k => S.users.reduce((a,u)=>a+Number(u[k]||0),0);
  const n = k => S.orders.filter(o=>NS(o.status)===k).length;
  const c = (t,v)=>`<div class="card"><small>${t}</small><b>${v}</b></div>`;
  return `<h1>Dashboard</h1><div class="cards">${c("Users",S.users.length)}${c("Total user balance",fmt(sum("balance"))+" BDT")}${c("Total income paid",fmt(sum("income"))+" BDT")}${c("Sale amount",fmt(sum("saleAmount"))+" BDT")}${c("Open orders",n("open"))}${c("Order Create",n("created"))}${c("Success",n("success"))}${c("Failed",n("failed"))}${c("Lock",n("lock"))}</div>`;
}

function users(){
  return `<h1>Users</h1><div class="box"><input id="q" placeholder="Search by phone, email or code" style="max-width:320px;margin-bottom:12px" oninput="window.filterUsers(this.value)">
  <table><thead><tr><th>Phone</th><th>Code</th><th>Referred by</th><th>Last IP</th><th>Balance</th><th>Income</th><th>Status</th><th></th></tr></thead><tbody id="ub">${userRows(S.users)}</tbody></table></div>`;
}
const userRows = list => list.length ? list.map(u=>{ const refCode = u.referredBy ? (S.users.find(x=>x.id===u.referredBy)?.code || u.referredBy.slice(0,6)+"...") : "-"; return `<tr><td>${esc(uName(u))}</td><td>${esc(u.code)}</td><td>${esc(refCode)}</td><td>${esc(u.lastIp||"-")}</td><td>${fmt(u.balance)}</td><td>${fmt(u.income)}</td><td><span class="tag ${ACC_TC[uStatus(u)]||""}">${ACC[uStatus(u)]}</span></td><td style="white-space:nowrap"><button class="sm out" data-edit="${u.id}">Edit</button> <button class="sm" data-bal="${u.id}">Balance</button> <button class="sm out" data-acct="${u.id}">Account</button> <button class="sm out" data-uhist="${u.id}">History</button></td></tr>`; }).join("") : `<tr><td colspan="8" style="color:var(--mute)">No users found.</td></tr>`;
window.filterUsers = v => { v=v.toLowerCase(); $("#ub").innerHTML = userRows(S.users.filter(u=>[u.phone,u.email,u.code,u.lastIp].join(" ").toLowerCase().includes(v))); };

const lastNum = k => { try { return localStorage.getItem("nerivo_"+k) || ""; } catch { return ""; } };

const userLabel = uid => { const u = S.users.find(x=>x.id===uid); return u ? (uName(u) || uid.slice(0,6)) + " · ref " + (u.code || "-") + (u.lastIp ? " · IP " + u.lastIp : "") : (uid ? uid.slice(0,6)+"..." : "-"); };
function oList(){
  const q = S.oq.trim().toLowerCase();
  return S.orders.filter(o => (S.of==="all" || NS(o.status)===S.of) && (!q || [o.amount,o.trxId,o.senderNumber,o.payMethod,o.bkashNumber,o.nagadNumber,o.mask,userLabel(o.claimedBy)].join(" ").toLowerCase().includes(q)));
}
function orderRows(){
  if (!S.orders.length) return `<tr><td colspan="7" style="color:var(--mute)">No orders yet. Create the first one above.</td></tr>`;
  const list = oList();
  if (!list.length) return `<tr><td colspan="7" style="color:var(--mute)">No orders match this filter.</td></tr>`;
  const dup = {}; S.orders.forEach(o => { if (o.trxId) { const k = o.trxId.toUpperCase(); dup[k] = (dup[k]||0)+1; } });
  const rank = {created:0,open:1,lock:2,success:3,failed:4};
  const when = o => tms(o.claimedAt) || tms(o.createdAt);
  return list.slice().sort((a,b)=>((rank[NS(a.status)]??5)-(rank[NS(b.status)]??5)) || (when(b)-when(a))).map(o => {
    const st = NS(o.status), claimed = !!o.claimedBy;
    const proof = o.trxId ? `${esc(o.payMethod)} from ${esc(o.senderNumber)}<br>TrxID: ${esc(o.trxId)}${dup[o.trxId.toUpperCase()]>1 ? ' <span class="tag x">DUPLICATE</span>' : ""}`
      : (o.payMethod ? `${esc(o.payMethod)}<br><span style="color:var(--mute)">TrxID not submitted</span>` : "-");
    const opts = (claimed ? ["created","success","failed","lock","open"] : ["open","lock"]).map(k=>`<option value="${k}" ${k===st?"selected":""}>${k==="open" && claimed ? "Open (release)" : LBL[k]}</option>`).join("");
    return `<tr><td>${esc(fdt(when(o)))}</td><td>${fmt(o.amount)}</td><td>bKash: ${esc(o.bkashNumber||"-")}<br>Nagad: ${esc(o.nagadNumber||"-")}</td><td><span class="tag ${TC[st]||""}">${esc(LBL[st]||st)}</span></td><td>${esc(userLabel(o.claimedBy))}</td><td>${proof}</td>
    <td><select id="st_${o.id}" style="width:auto;padding:6px 8px;font-size:13px">${opts}</select> <button class="sm" data-apply="${o.id}">Apply</button> <button class="sm out" data-hist="${o.id}">History</button> <button class="sm red" data-delorder="${o.id}">Delete</button></td></tr>`;
  }).join("");
}
window.filterOrders = v => { S.oq = v; const b = $("#otb"); if (b) b.innerHTML = orderRows(); };

function wsel(k,id){
  return `<select onchange="window.pickNum('${id}',this.value)" style="margin-bottom:6px"><option value="">Saved ${k==="bkash"?"bKash":"Nagad"} numbers...</option>${S.wl[k].map(w=>`<option value="${esc(w.n)}">${esc(w.n)}${w.label?" · "+esc(w.label):""}</option>`).join("")}</select>`;
}
function walletBox(){
  const rows = [["bkash","bKash"],["nagad","Nagad"]].flatMap(([k,l])=>S.wl[k].map((w,i)=>`<tr><td>${l}</td><td>${esc(w.n)}</td><td>${esc(w.label||"-")}</td><td><button class="sm red" data-delw="${k}:${i}">Delete</button></td></tr>`)).join("");
  return `<div class="box"><h3 style="margin-bottom:10px">Saved wallet numbers</h3><div class="form">
  <div><label>Type</label><select id="wt"><option value="bkash">bKash</option><option value="nagad">Nagad</option></select></div>
  <div><label>Wallet number</label><input id="wn" type="tel" placeholder="01XXXXXXXXX"></div>
  <div><label>Label (optional)</label><input id="wlb" placeholder="e.g. Agent 1"></div>
  <button data-addw>Save number</button></div>
  <table style="margin-top:12px"><thead><tr><th>Type</th><th>Number</th><th>Label</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="4" style="color:var(--mute)">No saved numbers yet. Numbers you use in an order are saved automatically.</td></tr>`}</tbody></table></div>`;
}
function orders(){
  const fl = [["all","All"],["open","Open"],["created","Order Create"],["success","Success"],["failed","Failed"],["lock","Lock"]];
  const cnt = k => k==="all" ? S.orders.length : S.orders.filter(o=>NS(o.status)===k).length;
  return `<h1>Buy orders</h1><div class="box"><h3 style="margin-bottom:10px">Create order</h3><div class="form">
  <div><label>Amount (BDT)</label><input id="oa" type="number" min="100" value="111"></div>
  <div><label>bKash number (user sends money here)</label>${wsel("bkash","ob")}<input id="ob" type="tel" placeholder="01XXXXXXXXX" value="${esc(lastNum("ob"))}"></div>
  <div><label>Nagad number (user sends money here)</label>${wsel("nagad","on")}<input id="on" type="tel" placeholder="01XXXXXXXXX" value="${esc(lastNum("on"))}"></div>
  <div><label>Buyer mask</label><input id="om" placeholder="179***7kPO"></div>
  <div><label>Reward rate %</label><input id="orr" type="number" step="0.1" value="3"></div>
  <button data-addorder>Create order</button></div></div>
  ${walletBox()}
  <div class="box"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${fl.map(([k,l])=>`<button class="sm ${S.of===k?"":"out"}" data-ofilter="${k}">${l} (${cnt(k)})</button>`).join("")}</div>
  <input id="oq" placeholder="Search user phone, code, TrxID, amount..." value="${esc(S.oq)}" style="max-width:360px;margin-bottom:12px" oninput="window.filterOrders(this.value)">
  <table><thead><tr><th>Time</th><th>Amount</th><th>Receive numbers</th><th>Status</th><th>User (claimed / created)</th><th>Payment</th><th>Change status</th></tr></thead><tbody id="otb">${orderRows()}</tbody></table></div>`;
}

function settings(){
  const rows = S.reasons.map(r=>`<tr><td>${esc(r.label)}</td><td>${RT[r.type]||esc(r.type)}</td><td><button class="sm red" data-delreason="${esc(r.id)}">Delete</button></td></tr>`).join("");
  return `<h1>Settings</h1><div class="box" style="max-width:420px"><h3 style="margin-bottom:6px">Rates &amp; rewards</h3><label>USDT exchange (1 USDT = ? BDT)</label><input id="ru" type="number" step="0.01" value="${S.rates.usdt}">
  <label>USDT bonus %</label><input id="rb" type="number" step="0.1" value="${S.rates.bonus}"><button style="margin-top:16px" data-saverates>Save rates</button></div>
  <div class="box" style="max-width:520px"><h3 style="margin-bottom:6px">Balance reasons</h3><p style="font-size:13px;color:var(--mute)">These appear when you add or cut a user's balance, and the user sees them in Balance Details.</p>
  <div class="form" style="margin-top:8px"><div><label>Reason name</label><input id="rn" placeholder="e.g. Bonus"></div><div><label>Used for</label><select id="rt"><option value="credit">Add balance</option><option value="debit">Cut balance</option><option value="both">Add &amp; Cut</option></select></div><button data-addreason>Add reason</button></div>
  <table style="margin-top:12px"><thead><tr><th>Reason</th><th>Used for</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="3" style="color:var(--mute)">No reasons yet.</td></tr>`}</tbody></table></div>`;
}

function render(){
  const r = $("#root"), ae = document.activeElement, keepOq = ae && ae.id==="oq" ? ae.selectionStart : null;
  if (!S.admin) { r.innerHTML = login(); return; }
  const n=(k,l)=>`<button class="${S.tab===k?"act":""}" data-tab="${k}">${l}</button>`;
  r.innerHTML = `<div class="wrap"><aside><h2>Nerivo Admin</h2>${n("dash","Dashboard")}${n("users","Users")}${n("orders","Buy orders")}${n("settings","Settings")}<button data-logout style="margin-top:18px">Log out</button></aside><main>${({dash,users,orders,settings})[S.tab]()}</main></div>`;
  if (keepOq !== null) { const el = $("#oq"); if (el) { el.focus(); try { el.setSelectionRange(keepOq,keepOq); } catch {} } }
}

/* ---------- Firebase logic ---------- */
function subscribe(){
  const {collection,doc,onSnapshot} = fb;
  const err = e => toast("Permission or network error");
  unsubs = [
    onSnapshot(collection(db,"users"), s=>{ S.users=s.docs.map(d=>({id:d.id,...d.data()})); render(); }, err),
    onSnapshot(collection(db,"buyOrders"), s=>{ S.orders=s.docs.map(d=>({id:d.id,...d.data()})); render(); }, err),
    onSnapshot(doc(db,"settings","reasons"), s=>{ if(s.exists() && Array.isArray(s.data().list)) S.reasons=s.data().list; if(S.tab!=="settings") render(); }, ()=>{}),
    onSnapshot(doc(db,"settings","wallets"), s=>{ if(s.exists()){ const d=s.data(); S.wl={bkash:d.bkash||[],nagad:d.nagad||[]}; } if(S.tab!=="orders") render(); }, ()=>{}),
    onSnapshot(doc(db,"settings","rates"), s=>{ if(s.exists()) S.rates=s.data(); if(S.tab!=="settings") render(); }, err)
  ];
}

async function doLogin(){
  S.err=""; const email=$("#em").value.trim(), pw=$("#pw").value;
  if (DEMO) { S.admin=true; render(); return; }
  try {
    const c = await fb.signInWithEmailAndPassword(auth,email,pw);
    const a = await fb.getDoc(fb.doc(db,"admins",c.user.uid));
    if (!a.exists()) { await fb.signOut(auth); S.err="This account is not an admin."; render(); return; }
    S.admin=true; subscribe(); render();
  } catch(e) { S.err = e.code==="auth/invalid-credential" ? "Wrong email or password." : e.message; render(); }
}

function editUser(id){
  const u = S.users.find(x=>x.id===id);
  const f = (k,l)=>`<label>${l}</label><input id="f_${k}" type="number" step="0.01" value="${u[k]||0}">`;
  const m = document.createElement("div"); m.className="modal";
  m.innerHTML = `<div class="sheet"><h2>${esc(uName(u))}</h2>
  <div class="box" style="margin-top:10px;padding:10px 14px;font-size:13px;color:var(--mute)">Referral code: <b>${esc(u.code||"-")}</b> &nbsp; Last IP: <b>${esc(u.lastIp||"-")}</b>${u.lastSeenAt ? " ("+esc(u.lastSeenAt.toDate ? u.lastSeenAt.toDate().toLocaleString() : "")+")" : ""}<br>Passwords cannot be viewed (Firebase never stores them in readable form). Use "Send password reset" below if the user is locked out.</div>
  <div class="box" style="margin-top:10px;padding:10px 14px;font-size:13px;color:var(--mute)">Balance: <b>${fmt(u.balance)} BDT</b>. To add or cut balance use the <b>Balance</b> button (reason is saved in history).</div>${f("income","Today's income")}${f("saleAmount","Sale amount")}${f("saleOrders","Sale orders")}${f("purchaseAmount","Purchase amount")}${f("purchaseOrders","Purchase orders")}
  <label>Set referrer (referral code or UID)</label><input id="f_ref" placeholder="${u.referredBy ? "Already set" : "e.g. ab12cd"}">
  <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap"><button id="sv">Save changes</button><button class="out" id="cn">Cancel</button></div></div>`;
  document.body.append(m);
  $("#cn").onclick = () => m.remove();
  $("#sv").onclick = async () => {
    const d = {}; ["income","saleAmount","saleOrders","purchaseAmount","purchaseOrders"].forEach(k=>d[k]=Number($("#f_"+k).value)||0);
    d.statsDate = (()=>{const x=new Date();return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")})();
    const rc = $("#f_ref").value.trim();
    if (rc && !DEMO) {
      try {
        let refUid = rc;
        if (rc.length <= 12) { const r = await fb.getDoc(fb.doc(db,"referralCodes",rc)); if (!r.exists()) return toast("Referral code not found"); refUid = r.data().uid; }
        if (refUid === id) return toast("A user cannot refer themselves");
        const ph = u.phone || "", nm = ph.length >= 8 ? ph.slice(0,4)+"****"+ph.slice(-3) : (u.email||"user").split("@")[0].slice(0,2)+"***";
        d.referredBy = refUid;
        await fb.setDoc(fb.doc(db,"users",refUid,"team",id), { name:nm, joinedAt:fb.serverTimestamp() });
      } catch(e) { return toast("Referral link failed: "+(e.code||e.message)); }
    }
    if (DEMO) Object.assign(u,d); else await fb.updateDoc(fb.doc(db,"users",id),d);
    m.remove(); render(); toast("Saved");
  };
}

const todayS = () => { const x = new Date(); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };

async function creditSuccess(id, entry){
  const day = todayS();
  await fb.runTransaction(db, async t => {
    const oRef = fb.doc(db,"buyOrders",id), os = await t.get(oRef);
    if (!os.exists()) throw new Error("Order not found");
    const od = os.data(); if (!od.claimedBy) throw new Error("No user claimed this order");
    const uRef = fb.doc(db,"users",od.claimedBy), us = await t.get(uRef);
    if (!us.exists()) throw new Error("User profile not found");
    const upd = { status:"success", reviewedAt:fb.serverTimestamp(), history:fb.arrayUnion(entry) };
    if (od.credited) { t.update(oRef, upd); return; }          /* balance was already added once, never add twice */
    const u = us.data(), fresh = u.statsDate !== day, reward = od.amount * od.rate / 100;
    t.update(oRef, { ...upd, credited:true });
    t.update(uRef, { balance:(u.balance||0)+od.amount, income:(fresh?0:(u.income||0))+reward, purchaseAmount:(fresh?0:(u.purchaseAmount||0))+od.amount, purchaseOrders:(fresh?0:(u.purchaseOrders||0))+1, statsDate:day });
    const L = fb.collection(db,"users",od.claimedBy,"ledger");
    t.set(fb.doc(L,id+"_buy"), { kind:"purchase", amount:od.amount, orderId:id, createdAt:fb.serverTimestamp() });
    t.set(fb.doc(L,id+"_reward"), { kind:"reward", amount:reward, orderId:id, createdAt:fb.serverTimestamp() });
  });
}

async function setStatus(id, ns){
  const o = S.orders.find(x=>x.id===id); if (!o) return;
  const cur = NS(o.status), claimed = !!o.claimedBy;
  if (cur === ns) return toast("Already "+LBL[ns]);
  if (ns === "success" && !claimed) return toast("No user has claimed this order");
  if (ns === "open" && cur === "success") return toast("A successful order cannot be released");
  const msg = ns === "success" ? "Mark SUCCESS? This adds "+fmt(o.amount)+" BDT balance and the reward to the user (only once)."
    : ns === "open" ? "Release this order back to the pool? The user's claim will be removed."
    : "Change status to "+LBL[ns]+"?"+(cur === "success" ? " The balance already added to the user stays (adjust it in Users if needed)." : "");
  if (!confirm(msg)) { render(); return; }
  const entry = { status:ns, by:"admin", admin:(auth?.currentUser?.email)||"admin", at:Date.now(), note:"Status changed by admin" };
  try {
    if (DEMO) { o.status = ns; if (ns === "open") { o.claimedBy = null; o.payMethod = null; } o.history = [...(o.history||[]), entry]; render(); return toast("Status: "+LBL[ns]); }
    if (ns === "success") await creditSuccess(id, entry);
    else {
      const d = { status:ns, reviewedAt:fb.serverTimestamp(), history:fb.arrayUnion(entry) };
      if (o.status === "done" || o.status === "claimed") d.credited = true;   /* old approved orders were already credited */
      if (ns === "open") Object.assign(d, { claimedBy:null, claimedAt:null, payMethod:null, senderNumber:null, trxId:null });
      await fb.updateDoc(fb.doc(db,"buyOrders",id), d);
    }
    toast("Status: "+LBL[ns]);
  } catch(e) { console.error(e); toast(e.message || "Update failed"); render(); }
}
