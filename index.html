<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light"><meta name="supported-color-schemes" content="light">
<meta name="theme-color" content="#1d93f2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<title>Nova Pay Admin</title>
<style>
:root{color-scheme:only light;--g:#1383e6;--gd:#0a2f55;--sky:#38b6ff;--mint:#eaf6ff;--mint2:#d5ebff;--line:#d3e5f4;--mute:#6a8399;--ink:#0c2238;--red:#c0392b;--shadow:0 10px 24px -12px rgba(19,131,230,.35);--display:"Sora","Segoe UI",system-ui,sans-serif;--body:"Figtree","Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--body);font-size:14px;line-height:1.4;background:radial-gradient(900px 380px at 60% -90px,#cfe9ff,#eef7ff 55%,#f7fbff);color:var(--ink)}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:11px;padding:8px 14px;background:linear-gradient(160deg,#42b9ff,#1383e6);color:#fff;box-shadow:0 8px 14px -9px rgba(19,131,230,.9);transition:filter .15s}
button:hover{filter:brightness(1.05)}
button.out{background:#fff;color:var(--g);border:1.5px solid var(--sky);box-shadow:none}button.red{background:var(--red);box-shadow:none}button.sm{padding:5px 11px;font-size:12.5px;border-radius:9px}
button.cpb{background:none;box-shadow:none;color:var(--g);padding:0;border-radius:6px;font-weight:600;font-size:inherit;text-align:left}button.cpb:hover{filter:none;text-decoration:underline}
input,select{font:inherit;padding:9px 11px;border:1.5px solid var(--line);border-radius:11px;background:#fff;width:100%;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:0;border-color:var(--sky);box-shadow:0 0 0 3px rgba(56,182,255,.2)}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-top:10px;margin-bottom:3px}
.wrap{display:flex;min-height:100vh}
aside{position:sticky;top:0;align-self:flex-start;height:100vh;width:190px;color:#fff;padding:18px 11px;flex:none;overflow:hidden;background:linear-gradient(170deg,#4cc0ff 0,#1d93f2 50%,#0f6fd0 100%)}
aside::before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.12);right:-70px;top:-60px;pointer-events:none}
aside>*{position:relative}
aside h2{font-family:var(--display);padding:2px 9px 16px;font-size:17px;font-weight:700;letter-spacing:-.01em}
aside button{display:block;width:100%;text-align:left;background:none;box-shadow:none;border-radius:11px;padding:10px 12px;margin-bottom:4px;color:#e3f3ff;font-weight:600}
aside button:hover{background:rgba(255,255,255,.14);filter:none}
aside button.act{background:#fff;color:var(--g);font-weight:700;box-shadow:0 8px 14px -9px rgba(10,47,85,.6)}
main{flex:1;padding:20px;min-width:0}
h1{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--gd);margin-bottom:14px}
h3{font-family:var(--display);font-size:15px;font-weight:700;color:var(--gd)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
.card{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#4cc0ff,#1383e6)}
.card small{color:var(--mute);font-size:12px;font-weight:600}.card b{display:block;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:4px;color:var(--gd)}
.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:13px;overflow-x:auto;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:700;font-size:12px;background:var(--mint)}th:first-child{border-radius:9px 0 0 9px}th:last-child{border-radius:0 9px 9px 0}
tbody tr:hover td{background:#f5fbff}
.tag{padding:3px 10px;border-radius:12px;font-size:11.5px;font-weight:700;background:#e2f6ec;color:#0b7a55}.tag.x{background:#fde8e6;color:var(--red)}.tag.cr{background:#fff3d6;color:#8a5a00}.tag.lk{background:#ece6f7;color:#5a3d99}.tag.fz{background:#dcefff;color:#0b5394}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;align-items:end}
.login{max-width:340px;margin:12vh auto;background:#fff;padding:24px 20px;border-radius:24px;border:1px solid var(--line);box-shadow:0 26px 50px -26px rgba(15,111,208,.55)}
.login h1{font-size:26px;color:var(--g)}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:16px}
.modal{position:fixed;inset:0;background:rgba(10,47,85,.45);display:grid;place-items:center;padding:14px;z-index:5}
.sheet{background:#fff;border-radius:22px;padding:18px;width:100%;max-width:400px;max-height:90vh;overflow:auto;box-shadow:0 30px 60px -28px rgba(10,47,85,.6)}
.sheet h2{font-family:var(--display);font-size:17px;color:var(--gd)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gd);color:#fff;padding:10px 18px;border-radius:22px;z-index:9;font-size:13.5px;font-weight:600;box-shadow:0 12px 24px -12px #0a2f55}
@media(max-width:700px){.wrap{flex-direction:column}aside{position:sticky;top:0;z-index:4;width:100%;height:auto;align-self:stretch;display:flex;flex-wrap:nowrap;gap:5px;padding:10px 12px;overflow-x:auto;scrollbar-width:none;align-items:center}aside::before{display:none}aside h2{width:auto;padding:0 8px 0 2px;white-space:nowrap;font-size:15px}aside button{width:auto;margin:0;white-space:nowrap;padding:8px 12px;font-size:13px}main{padding:13px}}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
</style>
</head>
<body>
<div id="root"><p style="padding:40px 20px;color:#7d8b86">Loading...</p></div>

<script>
function showErr(m){var d=document.getElementById('errbar')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'errbar'}));d.style.cssText='position:fixed;left:0;right:0;bottom:0;background:#c0392b;color:#fff;padding:12px 16px;font-size:13px;z-index:99;word-break:break-word';d.textContent='Error: '+m;}
addEventListener('error',function(e){showErr(e.message)});
addEventListener('unhandledrejection',function(e){showErr((e.reason&&e.reason.message)||e.reason)});
setTimeout(function(){var a=document.getElementById('app')||document.getElementById('root');if(a&&a.textContent.trim()==='Loading...')showErr('Still loading after 8 seconds. Check internet connection and that Firestore Database is created.')},8000);
</script>
<script type="module">
/* ====== Paste the SAME Firebase config you used in index.html ====== */
const firebaseConfig = {
  apiKey: "AIzaSyCWX-SgIhFjVAsi4REfJ7ZAlikg3x2DZZw",
  authDomain: "chatting-e498d.firebaseapp.com",
  projectId: "chatting-e498d",
  storageBucket: "chatting-e498d.firebasestorage.app",
  messagingSenderId: "765847410526",
  appId: "1:765847410526:web:420422de2045d4255c21cf",
  measurementId: "G-9FKGHT0TXT"
};
/* =================================================================== */

const DEMO = firebaseConfig.apiKey === "YOUR_API_KEY";
let fb = {}, auth, db;
if (!DEMO) try {
  const V = "https://www.gstatic.com/firebasejs/10.12.2/";
  const [a, f, ap] = await Promise.all([import(V+"firebase-auth.js"), import(V+"firebase-firestore.js"), import(V+"firebase-app.js")]);
  fb = { ...a, ...f };
  const app = ap.initializeApp(firebaseConfig, "nerivo-admin");   /* separate app name = separate login session from the user panel */
  auth = a.initializeAuth(app, { persistence: [a.indexedDBLocalPersistence, a.browserLocalPersistence, a.inMemoryPersistence] }); db = f.initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
} catch(e) { showErr("Firebase could not load: "+e.message+" (check internet or VPN)"); throw e; }

const $ = s => document.querySelector(s);
const fmt = n => Number(n || 0).toFixed(2);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S = { admin:false, tab:"dash", users:[], orders:[], rates:{usdt:130.34,bonus:3}, err:"", of:"all", oq:"", wl:{bkash:[],nagad:[]}, sells:[], sf:"all", sq:"", sellForm:{u:"",a:"",m:"bkash",n:"",q:""}, swl:null };
let unsubs = [];
/* Order status: open -> created (user claimed + picked wallet) -> success / failed / lock (admin decides). Old names are mapped. */
const NS = s => ({reserved:"created",done:"success",claimed:"success",rejected:"failed"})[s] || s;
/* order status: an order that has a TrxID but is still "created" counts as pending (old data) */
const OS = o => { const x = NS(o.status); return x==="created" && o.trxId ? "pending" : x; };
const LBL = {open:"Open",created:"Order Create",pending:"Pending",success:"Success",failed:"Failed",lock:"Lock"};
const TC = {created:"cr",pending:"fz",lock:"lk",failed:"x"};
const SL = {processing:"Processing",success:"Success",failed:"Failed",lock:"Lock"};
const STC = {processing:"fz",lock:"lk",failed:"x"};
const payName = m => m==="bkash" ? "bKash" : m==="nagad" ? "Nagad" : (m||"-");
const tms = t => t?.toMillis?.() || (typeof t==="number" ? t : 0);
/* Saved wallet numbers (shown to the user when they claim an order) */
const WL_KEY = "nerivo_wallets";
function loadW(){ try { const j = JSON.parse(localStorage.getItem(WL_KEY)||"null"); if (j) S.wl = { bkash:j.bkash||[], nagad:j.nagad||[] }; } catch {} }
async function saveW(){
  try { localStorage.setItem(WL_KEY, JSON.stringify(S.wl)); } catch {}
  if (!DEMO) { try { await fb.setDoc(fb.doc(db,"settings","wallets"), S.wl); } catch(e) { toast("Saved on this device only ("+(e.code||"error")+")"); } }
}
loadW();
window.pickNum = (id,v) => { if (v) { const el = $("#"+id); if (el) el.value = v; } };
const fdt = ms => ms ? new Date(ms).toLocaleString() : "-";
/* Account status + balance reasons */
const ACC = { active:"Active", banned:"Banned", suspended:"Suspended", frozen:"Frozen", locked:"Locked", deleted:"Deleted" };
const ACC_TC = { deleted:"x", banned:"x", suspended:"cr", frozen:"fz", locked:"lk" };
const uName = u => u.phone || (u.email||"").replace(/@nerivo\.local$/,"");
const uStatus = u => u.accountStatus || (u.disabled ? "banned" : "active");
const DEFAULT_REASONS = [ { id:"system_credit", label:"System Credit", type:"credit" }, { id:"withdraw", label:"Withdraw", type:"debit" }, { id:"system_debit", label:"System Debit", type:"debit" } ];
S.reasons = DEFAULT_REASONS.map(r => ({...r}));
S.tuts = [];
S.sup = [];
S.rcodes = [];
S.transfers = [];
S.tf = { fq:"", tq:"", a:"", n:"" };
S.ttab = "new"; S.tfs = ""; S.tfd = "0"; S.transferLimit = 0; S.bonus = 0;
S.rc = { amount:"", code:"", target:"all", ref:"", max:"" };
/* Refer program: level i = the i-th person above the user who finished the task (A = direct referrer, B = referrer of A ...) */
S.refCfg = null;
const REF_DEF = { enabled:true, levels:[{pct:0.3,on:true},{pct:0.2,on:true},{pct:0.1,on:true}], activeTasks:30, activeBonus:100 };
const refCfg = () => { const c = S.refCfg; return c && Array.isArray(c.levels) && c.levels.length ? { enabled:c.enabled!==false, levels:c.levels.map(l=>({ pct:Number(l.pct)||0, on:l.on!==false })), activeTasks:Number(c.activeTasks)||30, activeBonus:c.activeBonus==null ? 100 : Math.max(0, Number(c.activeBonus)||0) } : JSON.parse(JSON.stringify(REF_DEF)); };
const lvName = i => String.fromCharCode(65+i)+" level";
const round2 = n => Math.round(Number(n||0) * 100) / 100;
const maskId = m => { m = String(m||""); return (m.includes("*") || m.length <= 8) ? m : m.slice(0,3)+"***"+m.slice(-4); };   /* task cards show a short masked ID, e.g. 179***PjPuI */
const maskName = (ph, em) => (ph && ph.length >= 8) ? ph.slice(0,4) + "****" + ph.slice(-3) : ((em || "user").split("@")[0].slice(0,2) + "***");
/* Withdraw (sell) order ID: automatic short ID like WD123456. A buy task can be linked to it. */
const sNo = o => o.orderNo || String(o.id).slice(0,8).toUpperCase();
const B62 = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
/* Order ID = 10 digit time (seconds) + 9 random letters/digits, e.g. 1791306953ch8PRjPuI */
const newSellNo = () => { let n; do { const a = new Uint32Array(9); (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_,i)=>{ a[i] = Math.floor(Math.random()*4294967296); }); n = String(Math.floor(Date.now()/1000)) + Array.from(a, x => B62[x % 62]).join(""); } while (S.sells.some(x=>x.orderNo===n)); return n; };
const findSell = q => { q = String(q||"").trim(); if (!q) return null; const u = q.toUpperCase(); return S.sells.find(o => sNo(o)===q || o.id===q) || S.sells.find(o => sNo(o).toUpperCase()===u || String(o.id).toUpperCase()===u) || null; };
const sellTasks = o => S.orders.filter(x => x.sellOrderId===o.id && OS(x)!=="failed");
const sellPaid = o => round2(sellTasks(o).filter(x=>OS(x)==="success").reduce((a,x)=>a+Number(x.amount||0),0));
const sellLinked = o => round2(sellTasks(o).reduce((a,x)=>a+Number(x.amount||0),0));
const sellRemain = o => Math.max(0, round2(Number(o.amount||0) - sellLinked(o)));
window.owdFind = v => {
  const el = $("#owd_res"); if (!el) return;
  const q = String(v||"").trim(); const bk = $("#ob"), ng = $("#on");
  const lock = !!q; [bk, ng].forEach(i => { if (i) i.disabled = false; });
  const om = $("#om"), clearMask = () => { if (om && om.dataset.auto === "1") { om.value = ""; om.dataset.auto = ""; } };
  if (!q) { clearMask(); el.innerHTML = ""; return; }
  const o = findSell(q);
  if (!o) { clearMask(); el.innerHTML = `<div style="margin-top:6px;font-size:13px;color:var(--red)">No order found with this ID.</div>`; return; }
  if (o.status==="success" || o.status==="failed") { clearMask(); el.innerHTML = `<div style="margin-top:6px;font-size:13px;color:var(--red)">This withdraw is already ${esc(SL[o.status]||o.status)}.</div>`; return; }
  const rem = sellRemain(o);
  if (bk) { bk.value = o.method==="bkash" ? o.number : ""; bk.disabled = lock; }
  if (ng) { ng.value = o.method==="nagad" ? o.number : ""; ng.disabled = lock; }
  const oa = $("#oa"); if (oa && rem >= 100) oa.value = rem;
  if (om) { om.value = maskId(sNo(o)); om.dataset.auto = "1"; }   /* Buyer mask = short masked Order ID */
  el.innerHTML = `<div style="margin-top:6px;font-size:13px;color:#0b7a55">✓ <b>${esc(sNo(o))}</b> · ${esc(userLabel(o.userId))}<br>${fmt(o.amount)} BDT via ${esc(payName(o.method))} ${esc(o.number)}</div><div style="font-size:12px;color:var(--mute)">Already linked to tasks: ${fmt(sellLinked(o))} · Remaining: ${fmt(rem)} BDT. The task will pay this number, and this user will not see the task.</div>`;
};
const RT = { credit:"Add balance", debit:"Cut balance", both:"Add & Cut" };
const modal = html => { const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<div class="sheet">${html}</div>`; document.body.append(m); return m; };
const adminEmail = () => (auth?.currentUser?.email) || "admin";
const toast = m => { const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.append(t); setTimeout(()=>t.remove(),2200); };

if (DEMO) {
  S.users = [{id:"u1",phone:"+8801840000059",email:"demo@novapay.app",balance:13.63,income:1245.46,saleAmount:45222,saleOrders:39,purchaseAmount:0,purchaseOrders:0,code:"WcLvJ8"}];
  S.orders = [{id:"a",amount:111,type:"bkash",mask:"179***7kPO",rate:3,cancels:0,status:"open"},{id:"b",amount:110,type:"nagad",mask:"179***q0HO",rate:3,cancels:0,status:"claimed"}];
}

/* ---------- Views ---------- */
function login(){
  return `<div class="login"><h1 style="margin-bottom:4px">Nova Pay Admin</h1><p style="color:var(--mute);font-size:14px">${DEMO?"Demo mode: Firebase not set up. Tap Log in to preview.":"Only accounts listed in the admins collection can enter."}</p>
  <label>Email</label><input id="em" type="email" autocomplete="email"><label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <div class="err">${esc(S.err)}</div><button style="width:100%;margin-top:8px" data-login>Log in</button></div>`;
}

function dash(){
  const live = S.users.filter(u=>uStatus(u)!=="deleted");
  const sum = k => live.reduce((a,u)=>a+Number(u[k]||0),0);
  const n = k => S.orders.filter(o=>OS(o)===k).length;
  const sn = k => S.sells.filter(o=>o.status===k).length;
  const ds = dayStart();
  const doneAt = o => tms(o.reviewedAt) || ((o.history && o.history.length) ? (o.history[o.history.length-1].at||0) : 0) || tms(o.createdAt);
  const c = (t,v,sub)=>`<div class="card"><small>${t}</small><b>${v}</b>${sub ? `<div style="font-size:12px;color:var(--mute);margin-top:2px">${sub}</div>` : ""}</div>`;
  const amt = l => fmt(l.reduce((a,o)=>a+Number(o.amount||0),0))+" BDT";
  // same cards for "Today" and for "Total"
  const block = today => {
    const T = t => today ? t >= ds : true;
    const tr = S.transfers.filter(x=>T(tms(x.createdAt)||Date.now()));
    const by = S.orders.filter(o=>OS(o)==="success" && T(doneAt(o)));
    const bc = S.orders.filter(o=>T(tms(o.createdAt)));
    const wd = k => S.sells.filter(o=>o.status===k && T(doneAt(o)));
    const wc = (t,k) => { const l = wd(k); return c(t,amt(l),l.length+" order"+(l.length===1?"":"s")); };
    const nu = live.filter(u=>T(tms(u.createdAt)));
    return c("Transferred",amt(tr),tr.length+" transfer"+(tr.length===1?"":"s"))
      + c("Buy success",amt(by),by.length+" order"+(by.length===1?"":"s"))
      + wc("Withdraw success","success")
      + wc("Withdraw pending","processing")
      + wc("Withdraw failed","failed")
      + wc("Withdraw lock","lock")
      + c("Buy orders created",amt(bc),bc.length+" order"+(bc.length===1?"":"s"))
      + c("New users",nu.length);
  };
  return `<h1>Dashboard</h1>
  <h3 style="margin:2px 0 8px">Today</h3><div class="cards">${block(true)}</div>
  <h3 style="margin:18px 0 8px">Total (all time)</h3><div class="cards">${block(false)}</div>
  <h3 style="margin:18px 0 8px">Overview</h3><div class="cards">${c("Users",live.length)}${c("Total user balance",fmt(sum("balance"))+" BDT")}${c("Total income paid",fmt(sum("income"))+" BDT")}${c("Sale amount",fmt(sum("saleAmount"))+" BDT")}${c("Open orders",n("open"))}${c("Order Create",n("created"))}${c("Pending",n("pending"))}${c("Failed",n("failed"))}${c("Lock",n("lock"))}${c("Withdraw pending",sn("processing"))}${c("Withdraw lock",sn("lock"))}${c("Withdraw failed",sn("failed"))}</div>`;
}

function users(){
  return `<h1>Users</h1><div class="box"><input id="q" placeholder="Search by phone, email or code" style="max-width:320px;margin-bottom:12px" oninput="window.filterUsers(this.value)">
  <label style="display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:12px"><input type="checkbox" style="width:auto" ${S.showDel?"checked":""} onchange="window.toggleDel(this.checked)"> Show deleted accounts</label>
  <table><thead><tr><th>Phone</th><th>Code</th><th>Referred by</th><th>Last IP</th><th>Balance</th><th>Income</th><th>Status</th><th></th></tr></thead><tbody id="ub">${userRows(visU())}</tbody></table></div>`;
}
const userRows = list => list.length ? list.map(u=>{ const refCode = u.referredBy ? (S.users.find(x=>x.id===u.referredBy)?.code || u.referredBy.slice(0,6)+"...") : "-"; return `<tr><td>${cp(uName(u))}</td><td>${cp(u.code)}</td><td>${esc(refCode)}</td><td>${esc(u.lastIp||"-")}</td><td>${fmt(u.balance)}</td><td>${fmt(u.income)}</td><td><span class="tag ${ACC_TC[uStatus(u)]||""}">${ACC[uStatus(u)]}</span></td><td style="white-space:nowrap"><button class="sm out" data-edit="${u.id}">Edit</button> <button class="sm" data-bal="${u.id}">Balance</button> <button class="sm out" data-acct="${u.id}">Account</button> <button class="sm out" data-uhist="${u.id}">History</button></td></tr>`; }).join("") : `<tr><td colspan="8" style="color:var(--mute)">No users found.</td></tr>`;
const visU = () => S.users.filter(u => S.showDel || uStatus(u) !== "deleted");
window.toggleDel = v => { S.showDel = v; render(); };
window.filterUsers = v => { v=v.toLowerCase(); $("#ub").innerHTML = userRows(visU().filter(u=>[u.phone,u.email,u.code,u.lastIp].join(" ").toLowerCase().includes(v))); };

const lastNum = k => { try { return localStorage.getItem("nerivo_"+k) || ""; } catch { return ""; } };

const userLabel = uid => { const u = S.users.find(x=>x.id===uid); return u ? (uName(u) || uid.slice(0,6)) + " · ref " + (u.code || "-") + (u.lastIp ? " · IP " + u.lastIp : "") : (uid ? uid.slice(0,6)+"..." : "-"); };
function oList(){
  const q = S.oq.trim().toLowerCase();
  return S.orders.filter(o => (S.of==="all" || OS(o)===S.of) && (!q || [o.amount,o.trxId,o.senderNumber,o.payMethod,o.bkashNumber,o.nagadNumber,o.mask,maskId(o.mask),String(o.id).slice(0,8),o.sellOrderNo,userLabel(o.claimedBy)].join(" ").toLowerCase().includes(q)));

function orderRows(){

}

/* Copy to clipboard. Tries the old textarea method first (works on http pages and iOS, must run right inside the tap),
   then the modern API. Resolves true if copied. */
function copyText(text){
  text = String(text ?? "");
  const prev = document.activeElement;
  let ok = false;
  try {
    const ios = /ipad|iphone|ipod/i.test(navigator.userAgent || "");
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("aria-hidden", "true");
    if (!ios) ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;left:0;top:0;width:2em;height:2em;padding:0;border:0;outline:0;box-shadow:none;background:transparent;opacity:.01;font-size:16px";
    document.body.appendChild(ta);
    if (ios) {
      ta.contentEditable = "true"; ta.readOnly = false;
      const r = document.createRange(); r.selectNodeContents(ta);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      ta.setSelectionRange(0, 999999);
    } else { ta.focus(); ta.select(); ta.setSelectionRange(0, text.length); }
    ok = document.execCommand("copy");
    ta.remove();
    try { if (prev && prev.focus) prev.focus(); } catch {}
  } catch {}
  // also write through the modern clipboard API when the page allows it (https), so Gboard/clipboard managers see it
  try { if (navigator.clipboard && window.isSecureContext) { const pr = navigator.clipboard.writeText(text); if (ok) { pr.catch(()=>{}); return Promise.resolve(true); } return pr.then(() => true, () => false); } } catch {}
  return Promise.resolve(ok);
}

  if (!confirm("Transfer "+fmt(amt)+" BDT\nFrom: "+(uName(a)||a.id.slice(0,6))+" (ref "+a.code+")\nTo: "+(uName(b)||b.id.slice(0,6))+" (ref "+b.code+")?")) return;
  const note = String(f.n||"").trim();
  try {
    if (DEMO) {
      a.balance = Math.round((Number(a.balance||0)-amt)*100)/100; b.balance = Math.round((Number(b.balance||0)+amt)*100)/100;
      S.transfers.unshift({ id:String(Date.now()), from:a.id, to:b.id, fromCode:a.code, toCode:b.code, fromName:uName(a), toName:uName(b), amount:amt, note, by:adminEmail(), createdAt:Date.now() });
    } else await fb.runTransaction(db, async t => {
      const aRef = fb.doc(db,"users",a.id), bRef = fb.doc(db,"users",b.id), as = await t.get(aRef), bs = await t.get(bRef);
      if (!as.exists() || !bs.exists()) throw new Error("User not found");
      const ac = Number(as.data().balance||0), bc = Number(bs.data().balance||0);
      if (amt > ac) throw new Error("From user's balance is not enough");
      const an = Math.round((ac-amt)*100)/100, bn = Math.round((bc+amt)*100)/100;
      t.update(aRef, { balance:an }); t.update(bRef, { balance:bn });
      t.set(fb.doc(fb.collection(db,"transfers")), { from:a.id, to:b.id, fromCode:a.code||"", toCode:b.code||"", fromName:uName(a)||"", toName:uName(b)||"", amount:amt, note, fromAfter:an, toAfter:bn, by:adminEmail(), createdAt:fb.serverTimestamp() });
    });
  } catch(e) { console.error(e); return toast(e.message || "Transfer failed"); }
  S.tf = { fq:"", tq:"", a:"", n:"" }; render(); toast("Transferred "+fmt(amt)+" BDT");
}

/* ---- back support: phone back button / browser back / on-screen back ---- */
let navIdx = 0, navLast = null, navRestoring = false, navIgnore = 0;
function navSync(){
  if (navRestoring) return;
  try {
    const snap = navSnap(), key = JSON.stringify(snap);
    if (navLast === null) { history.replaceState({ nv:snap, i:0 }, ""); navLast = key; navIdx = 0; return; }
    if (key !== navLast) { history.pushState({ nv:snap, i:++navIdx }, ""); navLast = key; }
  } catch {}
}
try {
  new MutationObserver(muts => muts.forEach(mu => {
    mu.addedNodes.forEach(n => { if (n.classList && n.classList.contains("modal")) { n._h = true; try { history.pushState({ m:1, i:navIdx }, ""); } catch {} } });
    mu.removedNodes.forEach(n => { if (n.classList && n.classList.contains("modal") && n._h && !n._pop) { navIgnore++; try { history.back(); } catch { navIgnore--; } } });
  })).observe(document.body, { childList:true });
} catch {}
window.addEventListener("popstate", e => {
  if (navIgnore > 0) { navIgnore--; return; }
  const top = [...document.querySelectorAll(".modal")].pop();
  if (top) { top._pop = true; top.remove(); return; }
  const st = e.state; if (!st || !st.nv) return;
  navRestoring = true; navIdx = st.i || 0;
  navApply(st.nv);
  navRestoring = false;
  navLast = JSON.stringify(navSnap());
});

    onSnapshot(collection(db,"redeemCodes"), s=>{ S.rcodes=s.docs.map(d=>({id:d.id,...d.data()})); render(); }, err("redeemCodes")),
    onSnapshot(doc(db,"settings","support"), s=>{ if(s.exists() && Array.isArray(s.data().list)) S.sup=s.data().list; if(S.tab!=="settings") render(); }, ()=>{}),
    onSnapshot(doc(db,"settings","tutorials"), s=>{ if(s.exists() && Array.isArray(s.data().list)) S.tuts=s.data().list; if(S.tab!=="settings") render(); }, ()=>{}),

const todayS = () => new Date(Date.now()+6*3600*1000).toISOString().slice(0,10);   /* Bangladesh day (UTC+6), same as the user app */

/* walk up the referral chain (A = direct referrer, B = referrer of A ...). Reads only. */
async function readChain(t, first, self, n){
  const out = [], seen = new Set([self]); let cur = first;
  for (let i = 0; i < n && cur && !seen.has(cur); i++) {
    seen.add(cur);
    const ref = fb.doc(db,"users",cur), ps = await t.get(ref); if (!ps.exists()) break;
    const d = ps.data(); out.push({ i, uid:cur, ref, d }); cur = d.referredBy;
  }
  return out;
}

  await Promise.all(r.chain.map(c => fb.setDoc(fb.doc(db,"users",c.uid,"team",r.uid), { name:r.name, level:c.i, tasks:r.tasks, amount:r.amount, active:r.active, need:r.need, ...(r.joinedAt ? { joinedAt:r.joinedAt } : (c.i > 0 ? { joinedAt:fb.serverTimestamp() } : {})) }, { merge:true }).catch(e => bad.push(e))));
  if (bad.length) toast("Team list not updated ("+(bad[0].code||bad[0].message)+"). Check Firestore rules.");
}

async function creditSuccess(id, entry){
  const day = todayS();
  const res = await fb.runTransaction(db, async t => {
    const oRef = fb.doc(db,"buyOrders",id), os = await t.get(oRef);
    if (!os.exists()) throw new Error("Order not found");
    const od = os.data(); if (!od.claimedBy) throw new Error("No user claimed this order");
    const uRef = fb.doc(db,"users",od.claimedBy), us = await t.get(uRef);
    if (!us.exists()) throw new Error("User profile not found");
    const u = us.data();
    const upd = { status:"success", reviewedAt:fb.serverTimestamp(), history:fb.arrayUnion(entry) };
    /* Refer program: read the settings + the upline chain first (all reads must happen before any write) */
    const rs = await t.get(fb.doc(db,"settings","referral")), rd = rs.exists() && Array.isArray(rs.data().levels) && rs.data().levels.length ? rs.data() : REF_DEF;
    const need = Math.max(1, Number(rd.activeTasks)||30), bonus = rd.enabled !== false ? Math.max(0, round2(rd.activeBonus == null ? 100 : rd.activeBonus)) : 0;
    const chain = await readChain(t, u.referredBy, od.claimedBy, rd.levels.length);
    const hadList = od.credited && od.refReversed && Array.isArray(od.refPaid) && od.refPaid.length;
    const back = [];
    if (hadList) for (const p of od.refPaid) {      /* success again after a fail: give the same commissions back */
      let c = chain.find(x => x.uid === p.uid);
      if (!c) { const ref = fb.doc(db,"users",p.uid), ps = await t.get(ref); if (ps.exists()) c = { uid:p.uid, ref, d:ps.data() }; }
      if (c) back.push({ p, c });
    }
    /* task counter + active check (a task is counted once; counted again only if it failed and became Success again) */
    const recount = !od.credited || od.taskReversed === true;
    const tasks = (Number(u.taskDone)||0) + (recount ? 1 : 0), tamt = round2((Number(u.taskAmount)||0) + (recount ? Number(od.amount||0) : 0));
    const becameActive = recount && u.refActive !== true && tasks >= need, active = u.refActive === true || becameActive;
    const bonusPaid = becameActive && bonus > 0 && chain[0] && (chain[0].d.accountStatus||"active") !== "deleted" ? bonus : 0;
    const ups = [];
    if (!od.credited && rd.enabled !== false) chain.forEach(c => {
      const lv = rd.levels[c.i], pct = Number(lv.pct)||0, camt = Math.round(od.amount * pct) / 100;
      if (lv.on !== false && camt > 0 && (c.d.accountStatus||"active") !== "deleted") ups.push({ c, i:c.i, pct, amt:camt });
    });
    /* ---- writes ---- */
    const pay = {};      /* one balance update per upline, even if it gets a commission and the bonus together */
    const addPay = (c, amt) => { const k = pay[c.uid] || (pay[c.uid] = { ref:c.ref, bal:Number(c.d.balance||0), inc:Number(c.d.refIncome||0) }); k.bal += amt; k.inc += amt; return round2(k.bal); };
    const LG = uid => fb.collection(db,"users",uid,"ledger");
    const uu = {};
    if (od.credited) {          /* balance was already added once, never add twice */
      t.update(oRef, { ...upd, ...(hadList ? { refReversed:false } : {}), ...(od.taskReversed ? { taskReversed:false } : {}) });
      back.forEach(({ p, c }) => {
        const amt = Number(p.amount||0), nb = addPay(c, amt);
        t.set(fb.doc(LG(p.uid)), { kind:"referral", direction:"credit", amount:amt, level:p.level, levelName:p.name||lvName(p.level), pct:p.pct, orderId:id, fromUid:od.claimedBy, balanceAfter:nb, createdAt:fb.serverTimestamp() });
      });
    } else {
      const fresh = u.statsDate !== day, reward = Math.round(od.amount * od.rate) / 100;
      t.update(oRef, { ...upd, credited:true, refPaid:ups.map(p=>({ uid:p.c.uid, level:p.i, name:lvName(p.i), pct:p.pct, amount:p.amt })) });
      ups.forEach(p => {
        const nb = addPay(p.c, p.amt);
        t.set(fb.doc(LG(p.c.uid), id+"_ref"+p.i), { kind:"referral", direction:"credit", amount:p.amt, level:p.i, levelName:lvName(p.i), pct:p.pct, orderId:id, fromUid:od.claimedBy, balanceAfter:nb, createdAt:fb.serverTimestamp() });
      });
      Object.assign(uu, { balance:Math.round(((u.balance||0)+od.amount+reward)*100)/100, income:(fresh?0:(u.income||0))+reward, purchaseAmount:(fresh?0:(u.purchaseAmount||0))+od.amount, purchaseOrders:(fresh?0:(u.purchaseOrders||0))+1, statsDate:day });
      const L = LG(od.claimedBy);
      t.set(fb.doc(L,id+"_buy"), { kind:"purchase", amount:od.amount, orderId:id, createdAt:fb.serverTimestamp() });
      t.set(fb.doc(L,id+"_reward"), { kind:"reward", amount:reward, orderId:id, createdAt:fb.serverTimestamp() });
    }
    if (recount) Object.assign(uu, { taskDone:tasks, taskAmount:tamt });
    if (becameActive) Object.assign(uu, { refActive:true, refActiveAt:fb.serverTimestamp(), refBonusPaid:bonusPaid });
    if (Object.keys(uu).length) t.update(uRef, uu);
    if (bonusPaid > 0) {        /* Active referral bonus: the direct referrer (A level) gets it once */
      const nb = addPay(chain[0], bonusPaid);
      t.set(fb.doc(LG(chain[0].uid), "actbonus_"+od.claimedBy), { kind:"referral_bonus", direction:"credit", amount:bonusPaid, level:0, levelName:lvName(0), tasks:need, fromUid:od.claimedBy, orderId:id, balanceAfter:nb, createdAt:fb.serverTimestamp() });
    }
    Object.values(pay).forEach(k => t.update(k.ref, { balance:round2(k.bal), refIncome:round2(k.inc) }));
    return { uid:od.claimedBy, name:maskName(u.phone, u.email), joinedAt:u.createdAt||null, tasks, amount:tamt, active, need, chain:chain.map(c=>({ uid:c.uid, i:c.i })), changed:recount };
  });
  if (res && res.changed) await syncTeam(res);
}

/* Task became Failed after it was Success: take the referral commission back from every upline (A, B, C ...) and uncount the task */
async function reverseRef(id, entry){
  const res = await fb.runTransaction(db, async t => {
    const oRef = fb.doc(db,"buyOrders",id), os = await t.get(oRef);
    if (!os.exists()) throw new Error("Order not found");
    const od = os.data(), list = Array.isArray(od.refPaid) ? od.refPaid : [];
    const base = { status:"failed", reviewedAt:fb.serverTimestamp(), history:fb.arrayUnion(entry) };
    if (od.status === "done" || od.status === "claimed") base.credited = true;
    const counted = !!od.claimedBy && (od.credited === true || od.status === "done") && od.taskReversed !== true;
    let u = null, uRef = null, chain = [], rd = REF_DEF;
    if (counted) {
      uRef = fb.doc(db,"users",od.claimedBy); const us = await t.get(uRef);
      if (us.exists()) {
        u = us.data();
        const rs = await t.get(fb.doc(db,"settings","referral")); if (rs.exists() && Array.isArray(rs.data().levels) && rs.data().levels.length) rd = rs.data();
        chain = await readChain(t, u.referredBy, od.claimedBy, rd.levels.length);
      }
    }
    const doRef = list.length > 0 && !od.refReversed;
    const reads = [];
    if (doRef) for (const p of list) { const ref = fb.doc(db,"users",p.uid), ps = await t.get(ref); if (ps.exists()) reads.push({ p, ref, d:ps.data() }); }
    t.update(oRef, { ...base, ...(doRef ? { refReversed:true } : {}), ...(u ? { taskReversed:true } : {}) });
    reads.forEach(({ p, ref, d }) => {
      const nb = Math.round((Number(d.balance||0) - Number(p.amount||0)) * 100) / 100;
      t.update(ref, { balance:nb, refIncome:Math.max(0, Math.round((Number(d.refIncome||0) - Number(p.amount||0)) * 100) / 100) });
      t.set(fb.doc(fb.collection(db,"users",p.uid,"ledger")), { kind:"referral_reverse", direction:"debit", amount:Number(p.amount||0), level:p.level, levelName:p.name||lvName(p.level), pct:p.pct, orderId:id, fromUid:od.claimedBy, balanceAfter:nb, createdAt:fb.serverTimestamp() });
    });
    if (!u) return null;
    const tasks = Math.max(0, (Number(u.taskDone)||0) - 1), tamt = Math.max(0, round2((Number(u.taskAmount)||0) - Number(od.amount||0)));
    t.update(uRef, { taskDone:tasks, taskAmount:tamt });
    return { uid:od.claimedBy, name:maskName(u.phone, u.email), joinedAt:u.createdAt||null, tasks, amount:tamt, active:u.refActive === true, need:Math.max(1, Number(rd.activeTasks)||30), chain:chain.map(c=>({ uid:c.uid, i:c.i })) };
  });
  if (res) await syncTeam(res);
}

/* One-time tool: rebuild task counts + My Team lists for everybody from the Success orders. Pays no bonus. */
async function rebuildTeam(){
  if (DEMO) return toast("Not available in demo mode");
  if (!confirm("Rebuild team stats from all Success tasks? This fixes task counts and the My Team lists (A, B, C ...). It does NOT pay any bonus.")) return;
  const c = refCfg(), need = c.activeTasks, n = c.levels.length, byId = {}, cnt = {}, ops = [];
  S.users.forEach(u => { byId[u.id] = u; });
  S.orders.forEach(o => { if (o.claimedBy && OS(o) === "success") { const k = cnt[o.claimedBy] || (cnt[o.claimedBy] = { n:0, sum:0 }); k.n++; k.sum += Number(o.amount||0); } });
  S.users.forEach(u => {
    const k = cnt[u.id] || { n:0, sum:0 }, sum = round2(k.sum), act = u.refActive === true || k.n >= need;
    if ((Number(u.taskDone)||0) !== k.n || round2(u.taskAmount) !== sum || (act && u.refActive !== true)) {
      const d = { taskDone:k.n, taskAmount:sum }; if (act && u.refActive !== true) d.refActive = true;
      ops.push([fb.doc(db,"users",u.id), d, false]);
    }
    const seen = new Set([u.id]); let cur = u.referredBy;
    for (let i = 0; i < n && cur && !seen.has(cur) && byId[cur]; i++) {
      seen.add(cur);
      ops.push([fb.doc(db,"users",cur,"team",u.id), { name:maskName(u.phone, u.email), level:i, tasks:k.n, amount:sum, active:act, need, ...(u.createdAt ? { joinedAt:u.createdAt } : {}) }, true]);
      cur = byId[cur].referredBy;
    }
  });
  try {
    for (let i = 0; i < ops.length; i += 400) {
      const b = fb.writeBatch(db);
      ops.slice(i, i+400).forEach(([ref, d, merge]) => merge ? b.set(ref, d, { merge:true }) : b.update(ref, d));
      await b.commit();
    }
    toast("Team stats rebuilt ("+ops.length+" updates)");
  } catch(e) { toast("Rebuild failed: "+(e.code||e.message)); }
}

async function setStatus(id, ns){
  const o = S.orders.find(x=>x.id===id); if (!o) return;
  const cur = OS(o), claimed = !!o.claimedBy;
  if (cur === ns) return toast("Already "+LBL[ns]);
  if (ns === "success" && !claimed) return toast("No user has claimed this order");
  if (ns === "open" && cur === "success") return toast("A successful order cannot be released");
  const msg = ns === "success" ? "Mark SUCCESS? This adds "+fmt(o.amount)+" BDT + "+fmt(Math.round(o.amount*o.rate)/100)+" BDT reward to the user's balance (only once). Referral commission is also paid to the uplines automatically (see Refer program)."
    : ns === "open" ? "Release this order back to the pool? The user's claim will be removed."
    : "Change status to "+LBL[ns]+"?"+(cur === "success" ? " The balance already added to the user stays (adjust it in Users if needed)." : "")+(ns === "failed" && (o.refPaid||[]).length && !o.refReversed ? " The referral commission already paid to the uplines will be TAKEN BACK." : "");
  if (ns !== "success" && !confirm(msg)) { render(); return; }   /* Success needs no popup: money + referral commission are added automatically */
  const entry = { status:ns, by:"admin", admin:(auth?.currentUser?.email)||"admin", at:Date.now(), note:"Status changed by admin" };
  try {
    if (DEMO) { o.status = ns; if (ns === "open") { o.claimedBy = null; o.payMethod = null; } o.history = [...(o.history||[]), entry]; render(); return toast("Status: "+LBL[ns]); }
    if (ns === "success") await creditSuccess(id, entry);
    else if (ns === "failed" && (((o.refPaid||[]).length && !o.refReversed) || ((o.credited || cur === "success") && !o.taskReversed))) await reverseRef(id, entry);
    else {
      const d = { status:ns, reviewedAt:fb.serverTimestamp(), history:fb.arrayUnion(entry) };
      if (o.status === "done" || o.status === "claimed") d.credited = true;   /* old approved orders were already credited */
      if (ns === "open") Object.assign(d, { claimedBy:null, claimedAt:null, payMethod:null, senderNumber:null, trxId:null });
      await fb.updateDoc(fb.doc(db,"buyOrders",id), d);
    }
    toast("Status: "+LBL[ns]);
  } catch(e) { console.error(e); toast(e.message || "Update failed"); render(); }
}

async function createSell(){
  const f = S.sellForm, u = S.users.find(x=>x.id===f.u), amt = Math.round((Number(f.a)||0)*100)/100, num = String(f.n||"").trim();
  if (!u) return toast("Choose a user");
  if (!(amt >= 100)) return toast("Amount must be 100 or more");
  if (!/^01\d{9}$/.test(num)) return toast("Receive number must be 11 digits starting with 01");
  if (amt > Number(u.balance||0)) return toast("User balance is not enough");
  if (!confirm("Create sell order of "+fmt(amt)+" BDT for "+(uName(u)||u.id.slice(0,6))+"?\n"+fmt(amt)+" BDT will be cut from their balance now and sent to "+payName(f.m)+" "+num+" (Processing).")) return;
  const hist = [{ status:"processing", by:"admin", admin:adminEmail(), at:Date.now(), note:"Sell order created by admin" }], sellNo = newSellNo();
  try {
    if (DEMO) {
      u.balance = Math.round((Number(u.balance||0)-amt)*100)/100;
      S.sells.unshift({ id:String(Date.now()), orderNo:sellNo, userId:u.id, amount:amt, method:f.m, number:num, status:"processing", createdAt:Date.now(), history:hist });
    } else {
      await fb.runTransaction(db, async t => {
        const uRef = fb.doc(db,"users",u.id), us = await t.get(uRef);
        if (!us.exists()) throw new Error("User not found");
        const cur = Number(us.data().balance||0);
        if (amt > cur) throw new Error("User balance is not enough");
        const nb = Math.round((cur-amt)*100)/100, sRef = fb.doc(fb.collection(db,"sellOrders"));
        t.update(uRef, { balance:nb });
        t.set(sRef, { orderNo:sellNo, userId:u.id, amount:amt, method:f.m, number:num, status:"processing", createdAt:fb.serverTimestamp(), history:hist });
        t.set(fb.doc(fb.collection(db,"users",u.id,"ledger")), { kind:"withdraw", direction:"debit", amount:amt, orderId:sRef.id, balanceAfter:nb, by:adminEmail(), createdAt:fb.serverTimestamp() });
      });
    }
  } catch(e) { console.error(e); return toast(e.message || "Create sell order failed"); }
  S.sellForm = { u:"", a:"", m:"bkash", n:"", q:"" }; S.swl = null; render(); toast("Sell order created. Order ID: "+sellNo+". Balance cut.");
}

async function setSellStatus(id, ns){
  const o = S.sells.find(x=>x.id===id); if (!o) return;
  if (o.status === ns) return toast("Already "+SL[ns]);
  if (o.status==="success" || o.status==="failed") return toast("This request is already final");
  const msg = ns==="success" ? "Mark SUCCESS? Make sure you have sent "+fmt(o.amount)+" BDT to "+o.number+" ("+payName(o.method)+"). It will also be added to the user's Sale amount and Sale orders on their Home page."
    : ns==="failed" ? "Mark FAILED? "+fmt(o.amount)+" BDT will be refunded to the user's balance (only once)."
    : ns==="lock" ? "Lock this request? The balance stays cut and nothing is refunded."
    : "Move this request back to Processing?";
  if (!confirm(msg)) { render(); return; }
  const entry = { status:ns, by:"admin", admin:adminEmail(), at:Date.now(), note:"Status changed by admin" };
  try {
    if (DEMO) {
      if (ns==="failed") { const u = S.users.find(x=>x.id===o.userId); if (u) u.balance = Number(u.balance||0)+Number(o.amount||0); o.refunded = true; }
      if (ns==="success") { const u = S.users.find(x=>x.id===o.userId); if (u) { u.saleAmount = Number(u.saleAmount||0)+Number(o.amount||0); u.saleOrders = Number(u.saleOrders||0)+1; } }
      o.status = ns; o.history = [...(o.history||[]), entry]; render(); return toast("Status: "+SL[ns]);
    }
    const sRef = fb.doc(db,"sellOrders",id);
    if (ns==="failed") {
      await fb.runTransaction(db, async t => {
        const ss = await t.get(sRef); if (!ss.exists()) throw new Error("Request not found");
        const sd = ss.data(); if (sd.status==="success" || sd.status==="failed") throw new Error("Request is already final");
        const uRef = fb.doc(db,"users",sd.userId), us = await t.get(uRef); if (!us.exists()) throw new Error("User not found");
        const nb = Math.round((Number(us.data().balance||0)+Number(sd.amount||0))*100)/100;
        t.update(sRef, { status:"failed", refunded:true, reviewedAt:fb.serverTimestamp(), history:fb.arrayUnion(entry) });
        t.update(uRef, { balance:nb });
        t.set(fb.doc(fb.collection(db,"users",sd.userId,"ledger")), { kind:"withdraw_refund", direction:"credit", amount:Number(sd.amount||0), orderId:id, balanceAfter:nb, createdAt:fb.serverTimestamp() });
      });
    } else if (ns==="success") {
      // success: mark the request and add it to the user's Sale amount / Sale orders (shown on their Home page)
      await fb.runTransaction(db, async t => {
        const ss = await t.get(sRef); if (!ss.exists()) throw new Error("Request not found");
        const sd = ss.data(); if (sd.status==="success" || sd.status==="failed") throw new Error("Request is already final");
        const uRef = fb.doc(db,"users",sd.userId), us = await t.get(uRef); if (!us.exists()) throw new Error("User not found");
        const ud = us.data();
        t.update(sRef, { status:"success", reviewedAt:fb.serverTimestamp(), history:fb.arrayUnion(entry) });
        t.update(uRef, { saleAmount:Math.round((Number(ud.saleAmount||0)+Number(sd.amount||0))*100)/100, saleOrders:Number(ud.saleOrders||0)+1 });
      });
    } else {
      await fb.updateDoc(sRef, { status:ns, reviewedAt:fb.serverTimestamp(), history:fb.arrayUnion(entry) });
    }
    toast("Status: "+SL[ns]);
  } catch(e) { console.error(e); toast(e.message || "Update failed"); render(); }
}

  <label>Set account status</label><select id="as_st">${opts}</select>

  <div style="font-size:12px;color:var(--mute);margin-top:10px;line-height:1.6">Banned / Suspended: the user cannot use the app.<br>Frozen / Locked: the user can log in and see data, but cannot take new orders.</div>
  <div style="display:flex;gap:10px;margin-top:18px"><button id="as_sv">Save</button><button class="out" id="as_cn">Cancel</button></div>
  ${cur!=="deleted" ? `<button id="as_del" style="margin-top:22px;width:100%;background:var(--red);color:#fff">Delete this account</button><div style="font-size:12px;color:var(--mute);margin-top:6px;line-height:1.6">The user is signed out and can never log in again. Orders they claimed but did not pay for go back to the pool.</div>` : ""}`);
  $("#as_cn").onclick = () => m.remove();
  if ($("#as_del")) $("#as_del").onclick = () => deleteUser(id, m);
  $("#as_sv").onclick = async () => {
    const ns = $("#as_st").value, note = $("#as_note").value.trim();
    if (ns === cur && note === (u.accountNote||"")) return toast("No change");
    if (!confirm("Set "+uName(u)+" to "+ACC[ns]+"?")) return;
    const entry = { status:ns, by:adminEmail(), at:Date.now(), note };
    try {
      if (DEMO) Object.assign(u, { accountStatus:ns, disabled:ns!=="active", accountNote:note, statusLog:[...(u.statusLog||[]),entry] });
      else await fb.updateDoc(fb.doc(db,"users",id), { accountStatus:ns, disabled:ns!=="active", accountNote:note, statusAt:fb.serverTimestamp(), statusLog:fb.arrayUnion(entry) });
      m.remove(); render(); toast("Status: "+ACC[ns]);
    } catch(e) { toast("Failed: "+(e.code||e.message)); }
  };
}

/* ---------- Delete user ---------- */
async function deleteUser(id, m){
  const u = S.users.find(x=>x.id===id); if (!u) return;
  const label = uName(u);
  if (!confirm("Delete account "+label+"?\n\nThe user will be signed out and cannot log in again. Their balance ("+fmt(u.balance)+" BDT) stays in the record.")) return;
  if ((prompt("Type DELETE to confirm") || "").trim().toUpperCase() !== "DELETE") return toast("Cancelled");
  const entry = { status:"deleted", by:adminEmail(), at:Date.now(), note:"Account deleted by admin" };
  const free = S.orders.filter(o => o.claimedBy === id && OS(o) === "created" && !o.trxId);
  const oEntry = { status:"open", by:"admin", admin:adminEmail(), at:Date.now(), note:"Released: user account deleted" };
  try {
    if (DEMO) { Object.assign(u, { accountStatus:"deleted", disabled:true, statusLog:[...(u.statusLog||[]),entry] }); free.forEach(o=>{ o.status="open"; o.claimedBy=null; o.payMethod=null; }); }
    else {
      const b = fb.writeBatch(db);
      b.update(fb.doc(db,"users",id), { accountStatus:"deleted", disabled:true, accountNote:"", deletedAt:fb.serverTimestamp(), statusAt:fb.serverTimestamp(), statusLog:fb.arrayUnion(entry) });
      free.forEach(o => b.update(fb.doc(db,"buyOrders",o.id), { status:"open", claimedBy:null, claimedAt:null, payMethod:null, senderNumber:null, trxId:null, history:fb.arrayUnion(oEntry) }));
      await b.commit();
    }
    m.remove(); render(); toast("Account deleted");
  } catch(e) { console.error(e); toast("Delete failed: "+(e.code||e.message)); }
}

/* ---------- Balance add / cut ---------- */
function balanceModal(id){
  const u = S.users.find(x=>x.id===id); if (!u) return;
  const m = modal(`<h2>${esc(uName(u))}</h2>
  <div class="box" style="margin-top:10px;padding:10px 14px">Current balance: <b>${fmt(u.balance)} BDT</b></div>
  <label>Action</label><select id="ba_dir"><option value="add">Add balance</option><option value="cut">Cut balance</option></select>
  <label>Amount (BDT)</label><input id="ba_amt" type="number" min="0" step="0.01" placeholder="0.00">
  <label>Reason</label><select id="ba_rs"></select>
  <div id="ba_wd" style="display:none"><label>Send money via</label><select id="ba_wm"><option value="bkash">bKash</option><option value="nagad">Nagad</option></select><label>Receive number (user's wallet)</label><input id="ba_wn" type="tel" placeholder="01XXXXXXXXX"><div style="font-size:12px;color:var(--mute);margin-top:6px">This cut will also appear in Sell orders as Processing.</div></div>
  <label>Note (optional, the user can see it)</label><input id="ba_note" placeholder="e.g. Bonus for referral">
  <div id="ba_pv" style="font-size:13px;color:var(--mute);margin-top:10px;min-height:18px"></div>
  <div style="display:flex;gap:10px;margin-top:14px"><button id="ba_sv">Save</button><button class="out" id="ba_cn">Cancel</button></div>`);
  const prev = () => { const a = Number($("#ba_amt").value)||0, cur = Number(u.balance||0), nb = $("#ba_dir").value === "add" ? cur+a : cur-a; $("#ba_pv").textContent = a > 0 ? "New balance: "+fmt(nb)+" BDT"+(nb < 0 ? " (not enough balance)" : "") : ""; };
  const fill = () => {
    const need = $("#ba_dir").value === "add" ? "credit" : "debit", list = S.reasons.filter(r=>r.type===need || r.type==="both");
    $("#ba_rs").innerHTML = list.length ? list.map(r=>`<option value="${esc(r.id)}">${esc(r.label)}</option>`).join("") : `<option value="">No reason yet. Add one in Settings</option>`;
    prev();
  };
  const isWd = r => !!r && (r.id==="withdraw" || String(r.label||"").trim().toLowerCase()==="withdraw");
  const tw = () => { const r = S.reasons.find(x=>x.id===$("#ba_rs").value); $("#ba_wd").style.display = ($("#ba_dir").value==="cut" && isWd(r)) ? "block" : "none"; };
  $("#ba_dir").onchange = () => { fill(); tw(); }; $("#ba_rs").onchange = tw; $("#ba_amt").oninput = prev; fill(); tw();
  $("#ba_cn").onclick = () => m.remove();
  $("#ba_sv").onclick = async () => {
    const dir = $("#ba_dir").value, amt = Math.round((Number($("#ba_amt").value)||0)*100)/100, rid = $("#ba_rs").value, note = $("#ba_note").value.trim();
    const r = S.reasons.find(x=>x.id===rid);
    if (!(amt > 0)) return toast("Enter an amount greater than 0");
    if (!r) return toast("Choose a reason (add reasons in Settings)");
    const wd = dir==="cut" && isWd(r), wdNo = wd ? newSellNo() : "", wm = $("#ba_wm").value, wn = $("#ba_wn").value.trim();
    if (wd && !/^01\d{9}$/.test(wn)) return toast("Enter the user's 11-digit wallet number (01XXXXXXXXX)");
    if (!confirm((dir==="add" ? "Add " : "Cut ")+fmt(amt)+" BDT "+(dir==="add" ? "to " : "from ")+uName(u)+"\nReason: "+r.label+"?")) return;
    const entry = { kind:"adjust", direction:dir==="add"?"credit":"debit", amount:amt, reason:r.label, reasonId:r.id, note, by:adminEmail() };
    try {
      if (DEMO) {
        const nb = Number(u.balance||0) + (dir==="add" ? amt : -amt); if (nb < 0) throw new Error("Balance is not enough");
        u.balance = nb; u._ledger = [{ ...entry, balanceAfter:nb, createdAt:Date.now() }, ...(u._ledger||[])];
        if (wd) S.sells.unshift({ id:String(Date.now()), orderNo:wdNo, userId:id, amount:amt, method:wm, number:wn, status:"processing", createdAt:Date.now(), history:[{ status:"processing", by:"admin", admin:adminEmail(), at:Date.now(), note:"Created by admin (balance cut)" }] });
      } else {
        await fb.runTransaction(db, async t => {
          const uRef = fb.doc(db,"users",id), us = await t.get(uRef);
          if (!us.exists()) throw new Error("User not found");
          const cur = Number(us.data().balance||0), nb = Math.round((cur + (dir==="add" ? amt : -amt))*100)/100;
          if (nb < 0) throw new Error("Not enough balance. Current balance: "+fmt(cur));
          t.update(uRef, { balance:nb });
          const sRef = fb.doc(fb.collection(db,"sellOrders"));
          t.set(fb.doc(fb.collection(db,"users",id,"ledger")), { ...entry, ...(wd ? { orderId:sRef.id } : {}), balanceAfter:nb, createdAt:fb.serverTimestamp() });
          if (wd) t.set(sRef, { orderNo:wdNo, userId:id, amount:amt, method:wm, number:wn, status:"processing", createdAt:fb.serverTimestamp(), history:[{ status:"processing", by:"admin", admin:adminEmail(), at:Date.now(), note:"Created by admin (balance cut)" }] });
        });
      }
      m.remove(); render(); toast(wd ? "Balance cut and sent to Sell orders (Order ID: "+wdNo+")" : "Balance updated");
    } catch(e) { console.error(e); toast(e.message || "Failed"); }
  };
}

async function userHistory(id){
  const u = S.users.find(x=>x.id===id); if (!u) return;
  const m = modal(`<h2>History · ${esc(uName(u))}</h2><div id="uh_b" style="margin-top:12px;color:var(--mute)">Loading...</div><button class="out" id="uh_c" style="margin-top:16px;width:100%">Close</button>`);
  $("#uh_c").onclick = () => m.remove();
  let rows = [];
  try {
    if (DEMO) rows = u._ledger || [];
    else {
      const q = await fb.getDocs(fb.query(fb.collection(db,"users",id,"ledger"), fb.orderBy("createdAt","desc"), fb.limit(100))); rows = q.docs.map(d=>({ id:d.id, ...d.data() }));
      // admin-only transfers (users never see these)
      const [o1, o2] = await Promise.all([fb.getDocs(fb.query(fb.collection(db,"transfers"), fb.where("from","==",id))), fb.getDocs(fb.query(fb.collection(db,"transfers"), fb.where("to","==",id)))]);
      o1.docs.forEach(d=>{ const x = d.data(); rows.push({ id:d.id, kind:"transfer_out", direction:"debit", amount:x.amount, note:(x.note ? x.note+" · " : "")+"to "+(x.toName||"")+" (ref "+(x.toCode||"")+")", createdAt:x.createdAt, balanceAfter:x.fromAfter }); });
      o2.docs.forEach(d=>{ const x = d.data(); rows.push({ id:d.id, kind:"transfer_in", direction:"credit", amount:x.amount, note:(x.note ? x.note+" · " : "")+"from "+(x.fromName||"")+" (ref "+(x.fromCode||"")+")", createdAt:x.createdAt, balanceAfter:x.toAfter }); });
      rows.sort((a,b)=>tms(b.createdAt)-tms(a.createdAt));
    }
  } catch(e) { $("#uh_b").textContent = "Could not load: "+(e.code||e.message); return; }
  const lab = l => l.kind==="referral_bonus" ? "Active referral bonus" : l.kind==="signup_bonus" ? "Sign up bonus" : l.kind==="transfer_out" ? "Transfer sent" : l.kind==="transfer_in" ? "Transfer received" : l.kind==="redeem" ? "Redeem code ("+(l.code||"")+")" : l.kind==="withdraw" ? "Sell / Withdraw" : l.kind==="withdraw_refund" ? "Withdraw refund" : l.kind==="adjust" ? (l.reason||"Balance adjustment") : l.kind==="referral_reverse" ? "Referral commission taken back ("+(l.levelName||"")+")" : l.kind==="referral" ? "Referral commission ("+(l.levelName||"")+")" : l.kind==="reward" ? "Task reward" : "Order amount";
  const row = l => { const deb = (l.kind==="adjust" && l.direction==="debit") || l.kind==="withdraw" || l.kind==="transfer_out" || l.kind==="referral_reverse"; return `<div style="padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;display:flex;gap:10px"><div style="flex:1"><b>${esc(lab(l))}</b>${l.note ? `<div>${esc(l.note)}</div>` : ""}<div style="color:var(--mute);font-size:12px">${esc(fdt(tms(l.createdAt)))}${l.by ? " · by "+esc(l.by) : ""}${l.balanceAfter!=null ? " · balance after "+fmt(l.balanceAfter) : ""}</div></div><b style="color:${deb?"var(--red)":"var(--g)"}">${deb?"−":"+"}${fmt(l.amount)}</b></div>`; };
  const log = (u.statusLog||[]).slice().sort((a,b)=>b.at-a.at).map(e=>`<div style="padding:7px 0;border-bottom:1px solid var(--line);font-size:13px"><span class="tag ${ACC_TC[e.status]||""}">${esc(ACC[e.status]||e.status)}</span> ${esc(e.note||"")}<div style="color:var(--mute);font-size:12px">${esc(fdt(e.at))} · ${esc(e.by||"")}</div></div>`).join("");
  $("#uh_b").style.color = "inherit";
  $("#uh_b").innerHTML = `<h3 style="font-size:15px;margin-bottom:4px">Balance history</h3>${rows.length ? rows.map(row).join("") : `<div style="color:var(--mute)">No records yet.</div>`}${log ? `<h3 style="font-size:15px;margin:16px 0 4px">Account status log</h3>${log}` : ""}`;
}

async function saveSup(){ if (!DEMO) await fb.setDoc(fb.doc(db,"settings","support"), { list:S.sup }); }
async function saveTuts(){ if (!DEMO) await fb.setDoc(fb.doc(db,"settings","tutorials"), { list:S.tuts }); }
async function saveReasons(){ if (!DEMO) await fb.setDoc(fb.doc(db,"settings","reasons"), { list:S.reasons }); }

document.addEventListener("click", async e=>{
  const t = e.target.closest("button"); if(!t) return; const d = t.dataset;
  if ("goback" in d) { if (navIdx > 0) history.back(); }
  else if ("tab" in d) { S.tab=d.tab; render(); }
  else if ("cp" in d) copyOrShow(d.cp, "Copied: "+d.cp);
  else if ("login" in d) doLogin();
  else if ("edit" in d) editUser(d.edit);
  else if ("addorder" in d) addOrder();
  else if ("delorder" in d) {
    if (!confirm("Delete this order?")) return;
    if (DEMO) S.orders = S.orders.filter(o=>o.id!==d.delorder); else await fb.deleteDoc(fb.doc(db,"buyOrders",d.delorder));
    render(); toast("Deleted");
  }
  else if ("apply" in d) { const sel = $("#st_"+d.apply); if (sel) setStatus(d.apply, sel.value); }
  else if ("hist" in d) showHistory(d.hist);
  else if ("shist" in d) showSellHistory(d.shist);
  else if ("scopy" in d) {
    const o = S.sells.find(x=>x.id===d.scopy); if (!o) return;
    const u = S.users.find(x=>x.id===o.userId);
    await copyOrShow("Order ID: "+sNo(o)+"\nAmount: "+fmt(o.amount)+"\nWallet method: "+payName(o.method)+"\nWallet number: "+(o.number||"")+"\nUser refer code: "+((u&&u.code)||"-"), "Order details copied");
  }
  else if ("addsell" in d) createSell();
  else if ("sfpick" in d) window.sfUser(d.sfpick);
  else if ("sfclear" in d) { S.sellForm.u = ""; S.sellForm.n = ""; S.sellForm.q = ""; S.swl = null; render(); }
  else if ("swpick" in d) { const on = ((S.swl && S.swl.list) || []).filter(w=>w.online===true), w = on[Number(d.swpick)]; if (w) { S.sellForm.m = w.type; S.sellForm.n = w.number; render(); } }
  else if ("sapply" in d) { const sel = $("#ss_"+d.sapply); if (sel) setSellStatus(d.sapply, sel.value); }
  else if ("sofilter" in d) { S.sf = d.sofilter; render(); }
  else if ("ofilter" in d) { S.of = d.ofilter; render(); }
  else if ("bal" in d) balanceModal(d.bal);
  else if ("acct" in d) accountModal(d.acct);
  else if ("uhist" in d) userHistory(d.uhist);
  else if ("addreason" in d) {
    const label = $("#rn").value.trim(), type = $("#rt").value;
    if (!label) return toast("Enter a reason name");
    if (S.reasons.some(r=>r.label.toLowerCase()===label.toLowerCase())) return toast("This reason already exists");
    const prev = S.reasons.slice(); S.reasons.push({ id:"r_"+Date.now().toString(36), label, type });
    try { await saveReasons(); render(); toast("Reason added"); } catch(e) { S.reasons = prev; render(); toast("Failed: "+(e.code||e.message)); }
  }
  else if ("saveref" in d) { const c = collectRef(); await saveRef(c, "Refer program saved"); }
  else if ("rfrebuild" in d) await rebuildTeam();
  else if ("addlv" in d) { const c = collectRef(); if (c.levels.length >= 10) return toast("Maximum 10 levels"); c.levels.push({ pct:0, on:true }); await saveRef(c, lvName(c.levels.length-1)+" added. Set its % and save."); }
  else if ("rfdel" in d) { const c = collectRef(); if (c.levels.length < 2) return; if (!confirm("Remove "+lvName(c.levels.length-1)+"? Past commissions stay in history.")) return; c.levels.pop(); await saveRef(c, "Level removed"); }
  else if ("dotransfer" in d) doTransfer();
  else if ("ttab" in d) { S.ttab = d.ttab; S.tfs = ""; render(); }
  else if ("tfgo" in d) { S.tf.tq = d.tfgo; S.ttab = "new"; render(); scrollTo(0,0); }
  else if ("tfhist" in d) userHistory(d.tfhist);
  else if ("savetl" in d) {
    const v = Math.max(0, Math.floor(Number($("#tl_v").value) || 0));
    try { if (!DEMO) await fb.setDoc(fb.doc(db,"settings","transferLimit"), { perUserPerDay:v }); S.transferLimit = v; render(); toast(v ? "Limit saved: "+fmt(v)+" BDT per user per day" : "Limit removed"); } catch(e) { toast("Failed: "+(e.code||e.message)); }
  }
  else if ("rmw" in d) removeUserWallet(d.rmw);
  else if ("wbfill" in d) backfillWalletKeys();
  else if ("addrc" in d) createRC();
  else if ("rccopy" in d) copyOrShow(d.rccopy, "Copied: "+d.rccopy);
  else if ("rctoggle" in d) {
    const o = S.rcodes.find(x=>x.id===d.rctoggle); if (!o) return;
    const on = o.active === false;
    try { if (DEMO) o.active = on; else await fb.updateDoc(fb.doc(db,"redeemCodes",o.id), { active:on }); render(); toast(on ? "Code enabled" : "Code disabled"); } catch(e) { toast("Failed: "+(e.code||e.message)); }
  }
  else if ("rcdel" in d) {
    if (!confirm("Delete code "+d.rcdel+"? Users who already redeemed it keep their balance and history.")) return;
    try { if (DEMO) S.rcodes = S.rcodes.filter(x=>x.id!==d.rcdel); else await fb.deleteDoc(fb.doc(db,"redeemCodes",d.rcdel)); render(); toast("Deleted"); } catch(e) { toast("Failed: "+(e.code||e.message)); }
  }
  else if ("addsup" in d) {
    const type = $("#sut").value, label = $("#sun").value.trim(), url = supUrl(type, $("#sul").value);
    if (!label) return toast("Enter a name");
    if (!url) return toast(type==="telegram" ? "Enter a https:// link or a Telegram @username" : "Enter a https:// link or a WhatsApp number with country code");
    const prev = S.sup.slice(); S.sup.push({ id:"s_"+Date.now().toString(36), type, label, url });
    try { await saveSup(); render(); toast("Link added"); } catch(e) { S.sup = prev; render(); toast("Failed: "+(e.code||e.message)); }
  }
  else if ("delsup" in d) {
    if (!confirm("Delete this support link?")) return;
    const prev = S.sup.slice(); S.sup = S.sup.filter(x=>x.id!==d.delsup);
    try { await saveSup(); render(); toast("Deleted"); } catch(e) { S.sup = prev; render(); toast("Failed: "+(e.code||e.message)); }
  }
  else if ("upsup" in d) {
    const i = S.sup.findIndex(x=>x.id===d.upsup); if (i < 1) return;
    const prev = S.sup.slice(); [S.sup[i-1], S.sup[i]] = [S.sup[i], S.sup[i-1]];
    try { await saveSup(); render(); } catch(e) { S.sup = prev; render(); toast("Failed: "+(e.code||e.message)); }
  }
  else if ("addtut" in d) {
    const title = $("#tt").value.trim(), sub = $("#ts").value.trim(), url = $("#tl").value.trim();
    if (!title) return toast("Enter a title");
    if (!/^https?:\/\/\S+$/i.test(url)) return toast("Enter a full video link starting with https://");
    const prev = S.tuts.slice(); S.tuts.push({ id:"t_"+Date.now().toString(36), title, sub, url });
    try { await saveTuts(); render(); toast("Video added"); } catch(e) { S.tuts = prev; render(); toast("Failed: "+(e.code||e.message)); }
  }
  else if ("deltut" in d) {
    if (!confirm("Delete this tutorial video?")) return;
    const prev = S.tuts.slice(); S.tuts = S.tuts.filter(t=>t.id!==d.deltut);
    try { await saveTuts(); render(); toast("Deleted"); } catch(e) { S.tuts = prev; render(); toast("Failed: "+(e.code||e.message)); }
  }
  else if ("uptut" in d) {
    const i = S.tuts.findIndex(t=>t.id===d.uptut); if (i < 1) return;
    const prev = S.tuts.slice(); [S.tuts[i-1], S.tuts[i]] = [S.tuts[i], S.tuts[i-1]];
    try { await saveTuts(); render(); } catch(e) { S.tuts = prev; render(); toast("Failed: "+(e.code||e.message)); }
  }
  else if ("delreason" in d) {
    if (!confirm("Delete this reason? Old history keeps its text.")) return;
    const prev = S.reasons.slice(); S.reasons = S.reasons.filter(r=>r.id!==d.delreason);
    try { await saveReasons(); render(); toast("Deleted"); } catch(e) { S.reasons = prev; render(); toast("Failed: "+(e.code||e.message)); }
  }
  else if ("addw" in d) {
    const k = $("#wt").value, n = $("#wn").value.trim(), label = $("#wlb").value.trim();
    if (!/^01\d{9}$/.test(n)) return toast("Number must be 11 digits starting with 01");
    if (S.wl[k].some(w=>w.n===n)) return toast("This number is already saved");
    S.wl[k].push({ n, label }); await saveW(); render(); toast("Number saved");
  }
  else if ("delw" in d) {
    const [k,i] = d.delw.split(":"); if (!confirm("Delete this saved number? Existing orders keep their number.")) return;
    S.wl[k].splice(+i,1); await saveW(); render(); toast("Deleted");
  }
  else if ("savelang" in d) {
    const enabled = [["en","#lg_en"],["bn","#lg_bn"]].filter(([k,id])=>$(id).checked).map(x=>x[0]), def = $("#lg_def").value;
    if (!enabled.length) return toast("Turn on at least one language");
    if (!enabled.includes(def)) return toast("The default language must be one of the available languages");
    try { if (!DEMO) await fb.setDoc(fb.doc(db,"settings","language"), { default:def, enabled }); S.langCfg = { default:def, enabled }; render(); toast("Language saved"); } catch(e) { toast("Failed: "+(e.code||e.message)); }
  }
  else if ("savebonus" in d) {
    const v = Math.max(0, Math.round((Number($("#sb_v").value)||0)*100)/100);
    try { if (!DEMO) await fb.setDoc(fb.doc(db,"settings","signupBonus"), { amount:v }); S.bonus = v; render(); toast(v ? "Sign up bonus saved: "+fmt(v)+" BDT" : "Sign up bonus turned off"); } catch(e) { toast("Failed: "+(e.code||e.message)); }
  }
  else if ("saverates" in d) {
    const r = { usdt:Number($("#ru").value), bonus:Number($("#rb").value) };
    if (DEMO) S.rates=r; else await fb.setDoc(fb.doc(db,"settings","rates"),r);
    toast("Rates saved");
  }
  else if ("logout" in d) { unsubs.forEach(u=>u()); unsubs=[]; if(!DEMO) await fb.signOut(auth); S.admin=false; render(); }
});

document.addEventListener("change", e => { const el = e.target; if (el && el.dataset && el.dataset.rf === "on") { const sp = el.parentElement.querySelector("span"); if (sp) sp.textContent = el.checked ? "On" : "Off"; } });

render();
